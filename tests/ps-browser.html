<!doctype html><html lang="de"><meta charset="utf-8"><title>PowerShell Browserprüfung</title><h1>200 PowerShell-Musterlösungen im Web Worker</h1><p id="status">Prüfung startet …</p><pre id="details"></pre><script src="./ps/data/m01.js"></script><script src="./ps/data/m02.js"></script><script src="./ps/data/m03.js"></script><script src="./ps/data/m04.js"></script><script src="./ps/data/m05.js"></script><script src="./ps/data/m06.js"></script><script src="./ps/data/m07.js"></script><script src="./ps/data/m08.js"></script><script src="./ps/data/m09.js"></script><script src="./ps/data/m10.js"></script><script src="./ps/data/m11.js"></script><script src="./ps/data/m12.js"></script><script src="./ps/data/m13.js"></script><script src="./ps/data/m14.js"></script><script src="./ps/data/m15.js"></script><script src="./ps/data/m16.js"></script><script src="./ps/data/m17.js"></script><script src="./ps/data/m18.js"></script><script src="./ps/data/m19.js"></script><script src="./ps/data/m20.js"></script><script>
(async()=>{let passed=0,failed=[];for(const e of CURRICULUM.flatMap(m=>m.exercises)){await new Promise(resolve=>{const w=new Worker('./ps/worker.js'),end=message=>{clearTimeout(timer);w.terminate();if(message)failed.push(e.id+': '+message);else passed++;resolve();},timer=setTimeout(()=>end('Zeitlimit'),3000);w.onerror=()=>end('Workerfehler');w.onmessage=event=>{const msg=event.data;end(msg.kind==='complete'&&JSON.stringify(msg.result.output)===JSON.stringify(e.tests[0].expected)?'':JSON.stringify(msg));};w.postMessage({code:e.solution.js});});document.querySelector('#status').textContent=`${passed} bestanden · ${failed.length} Fehler`;}document.querySelector('#details').textContent=failed.length?failed.join('\n'):'PASS: alle 200 Ausgaben entsprechen den unabhängig hinterlegten Erwartungen.';})();
</script></html>
