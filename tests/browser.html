<!doctype html><html lang="de"><meta charset="utf-8"><title>jstutor Browser-Prüfung</title><style>body{font:14px system-ui;padding:30px;color:#24382e;background:#f6f7f2}button{padding:12px 20px}#preview{width:900px;height:300px}iframe{width:100%;height:100%;border:1px solid #ccc}li{padding:4px}.pass{color:seagreen}.fail{color:crimson}</style><h1>200 Musterlösungen im isolierten Browser prüfen</h1><button id="start">Alle Musterlösungen prüfen</button><button id="starters">Alle Startcodes prüfen</button><p id="status" role="status">Bereit</p><div id="preview"></div><ul id="results"></ul><script>
for(let i=1;i<=20;i++)document.write('<script src="./data/m'+String(i).padStart(2,'0')+'.js"><\/script>');
</script><script src="./runner.js"></script><script>
const all=window.CURRICULUM.flatMap(m=>m.exercises);const only=new URLSearchParams(location.search).get('id');const exercises=only?all.filter(e=>e.id===only):all;let failures=[],results=[];
async function runSuite(starters=false){document.querySelector('#start').disabled=true;document.querySelector('#starters').disabled=true;document.querySelector('#results').replaceChildren();failures=[];results=[];for(const e of exercises){document.querySelector('#status').textContent=`Prüfe ${e.id}: ${e.title} (${results.length}/${exercises.length})`;const result=await new Promise(resolve=>{let errors=[];JSTRunner.run(document.querySelector('#preview'),starters?e.starter:e.solution,e.tests,(kind,payload)=>{if(kind==='error')errors.push(payload.text);if(kind==='timeout')resolve({pass:false,errors:['Timeout']});if(kind==='result')resolve({pass:Array.isArray(payload)&&payload.length===e.tests.length&&payload.every(x=>x.pass)&&!errors.length,errors,checks:payload});});});if(starters)result.pass=!result.pass;results.push({id:e.id,...result});if(!result.pass){failures.push({id:e.id,...result});const li=document.createElement('li');li.className='fail';li.textContent=e.id+' '+e.title+' '+JSON.stringify(result);document.querySelector('#results').append(li);}}JSTRunner.stop();document.querySelector('#status').textContent=`FERTIG ${starters?'STARTCODES':'MUSTERLÖSUNGEN'}: ${results.filter(x=>x.pass).length}/${exercises.length} bestanden; ${failures.length} Fehler`;document.querySelector('#start').disabled=false;document.querySelector('#starters').disabled=false;window.QA_RESULTS=results;}document.querySelector('#start').onclick=()=>runSuite(false);document.querySelector('#starters').onclick=()=>runSuite(true);
</script></html>
